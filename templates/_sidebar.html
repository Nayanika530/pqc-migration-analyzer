<div class="sidebar">
    <div class="sidebar-logo">
        <svg viewBox="0 0 28 28" width="22" height="22" fill="none">
            <path d="M14 2L4 8v8c0 5.2 3.6 10 10 11.2 6.4-1.2 10-6 10-11.2V8L14 2z" fill="#2E9EFF" opacity="0.2" stroke="#2E9EFF" stroke-width="1.8"/>
            <text x="14" y="18" text-anchor="middle" fill="#2E9EFF" font-family="'Unbounded', sans-serif" font-size="12" font-weight="700">Q</text>
        </svg>
        <span>Qryptis</span>
    </div>

    <a href="{{ url_for('home') }}" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg>
        <span>Home</span>
    </a>

    <a href="{{ url_for('analyze') }}" class="sidebar-link {% if request.path == '/analyze' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Analyze Console</span>
    </a>

    <a href="{{ url_for('scan') }}" class="sidebar-link {% if request.path == '/scan' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        <span>Code Scanner</span>
    </a>

    <a href="{{ url_for('manual') }}" class="sidebar-link {% if request.path == '/manual' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
        <span>Manual Lookup</span>
    </a>

    <a href="{{ url_for('live_scan') }}" class="sidebar-link {% if request.path == '/live-scan' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Live SSL Scan</span>
    </a>

    <a href="{{ url_for('database') }}" class="sidebar-link {% if request.path == '/database' %}active{% endif %}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        <span>Algorithm DB</span>
    </a>

    {% if session.user %}
    <div class="sidebar-user-card" style="margin-top: auto;">
        <div class="sidebar-user-info">
            <div class="sidebar-user-avatar">
                {{ (session.user.name or session.user.username or 'U')[0]|upper }}
            </div>
            <div class="sidebar-user-text">
                <span class="sidebar-user-name" title="{{ session.user.name or session.user.username }}">{{ session.user.name or session.user.username }}</span>
                <span class="sidebar-user-role">PQC Analyst &bull; Active</span>
            </div>
        </div>
        <a href="{{ url_for('logout') }}" class="sidebar-logout-btn" title="Sign Out">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
    </div>
    {% else %}
    <a href="{{ url_for('login', next=request.path) }}" class="sidebar-link {% if request.path == '/login' %}active{% endif %}" style="margin-top: auto;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Security Login</span>
    </a>
    {% endif %}
</div>
