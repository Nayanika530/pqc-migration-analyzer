<!DOCTYPE html>
<html>
<head>
    <title>Qryptis - Analyze</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='analyze.css') }}">
</head>
<body>
    <div class="app-shell">
        {% include "_sidebar.html" %}

        <div class="main-content">
            <h1>Analyze</h1>
            <p style="color:var(--text-muted); margin-bottom:2rem;">Choose how you want to analyze your cryptography.</p>

            <div class="option-cards">
                <a href="{{ url_for('manual') }}" class="option-card">
                    <h2>Manual Lookup</h2>
                    <p>Check any algorithm + key size to see its quantum & classical risk and get PQC recommendations.</p>
                    <span class="option-arrow">→</span>
                </a>

                <a href="{{ url_for('scan') }}" class="option-card">
                    <h2>Scan Code</h2>
                    <p>Scan your code to detect cryptographic usage and get a full security report.</p>
                    <span class="option-arrow">→</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
